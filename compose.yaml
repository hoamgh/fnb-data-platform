name: fnb-platform
services:
  postgres:
    image: postgres:15@sha256:3b0d656f5fff31c7d8a64f500a703dcf3f35e98ce78f602831a73059a5e6a012
    restart: unless-stopped
    environment:
      POSTGRES_USER: fnb_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password, crawler_password, airflow_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-fnb.sh:ro
      - ./docker/postgres/migrations:/fnb-migrations:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fnb_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [platform]
  storage-init:
    image: ${FNB_IMAGE_PREFIX:-fnb}/etl:local
    build: {context: ., dockerfile: docker/runtime/Dockerfile, target: pipeline}
    user: "0:0"
    command: [python, -c, "import os; paths=['/demo','/demo/jobs','/state','/logs']; [(os.makedirs(p,exist_ok=True),os.chown(p,10000,0),os.chmod(p,0o2770)) for p in paths]"]
    volumes: [demo_outputs:/demo, crawl_state:/state, airflow_logs:/logs]
    networks: [platform]
  pipeline:
    image: ${FNB_IMAGE_PREFIX:-fnb}/etl:local
    build: {context: ., dockerfile: docker/runtime/Dockerfile, target: pipeline}
    profiles: [tools]
    user: "10000:0"
    depends_on:
      storage-init: {condition: service_completed_successfully}
    volumes:
      - demo_outputs:/demo
      - crawl_state:/state
      - type: bind
        source: ${FNB_INPUT_ROOT:-./config}
        target: /inputs
        read_only: true
        bind: {create_host_path: false}
    networks: [platform]
  dbt:
    image: ${FNB_IMAGE_PREFIX:-fnb}/dbt:local
    build: {context: ., dockerfile: docker/runtime/Dockerfile, target: dbt}
    profiles: [tools]
    user: "10000:0"
    environment:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    depends_on:
      storage-init: {condition: service_completed_successfully}
    volumes: [demo_outputs:/demo]
    networks: [platform]
  crawler:
    image: ${FNB_IMAGE_PREFIX:-fnb}/crawler:local
    build: {context: ., dockerfile: docker/runtime/Dockerfile, target: crawler}
    profiles: [crawler]
    user: "10000:0"
    shm_size: 1gb
    depends_on:
      storage-init: {condition: service_completed_successfully}
    volumes: [demo_outputs:/demo, crawl_state:/state]
    networks: [browser_smoke]
  airflow-init: &airflow
    image: ${FNB_IMAGE_PREFIX:-fnb}/airflow:2.10.5
    build: {context: ., dockerfile: docker/runtime/Dockerfile, target: airflow}
    user: "50000:0"
    environment:
      FNB_ALLOW_LIVE_CRAWL: ${FNB_ALLOW_LIVE_CRAWL:-0}
      FNB_ALLOW_DOWNLOADS: ${FNB_ALLOW_DOWNLOADS:-0}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__SCHEDULER__STANDALONE_DAG_PROCESSOR: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: "false"
    secrets: [airflow_password, fernet_key, webserver_key, ui_password]
    depends_on:
      postgres: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
      - demo_outputs:/demo
      - crawl_state:/state
      - type: bind
        source: ${FNB_INPUT_ROOT:-./config}
        target: /inputs
        read_only: true
        bind: {create_host_path: false}
    networks: [platform]
    command: [init]
  airflow-webserver:
    <<: *airflow
    secrets: [airflow_password, fernet_key, webserver_key]
    command: [webserver]
    ports: ["127.0.0.1:${FNB_AIRFLOW_PORT:-18080}:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/health]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  airflow-scheduler:
    <<: *airflow
    secrets: [airflow_password, fernet_key, webserver_key, crawler_password]
    command: [scheduler]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8974/health]
      interval: 15s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data:
  demo_outputs:
  crawl_state:
  airflow_logs:
networks:
  platform:
  browser_smoke:
    internal: true
secrets:
  admin_password:
    file: ${FNB_SECRETS_ROOT:-./.auth/fnb}/admin_password
  crawler_password:
    file: ${FNB_SECRETS_ROOT:-./.auth/fnb}/crawler_password
  airflow_password:
    file: ${FNB_SECRETS_ROOT:-./.auth/fnb}/airflow_password
  fernet_key:
    file: ${FNB_SECRETS_ROOT:-./.auth/fnb}/fernet_key
  webserver_key:
    file: ${FNB_SECRETS_ROOT:-./.auth/fnb}/webserver_key
  ui_password:
    file: ${FNB_SECRETS_ROOT:-./.auth/fnb}/ui_password
