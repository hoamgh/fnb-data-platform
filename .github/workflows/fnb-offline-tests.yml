name: F&B Offline Tests

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Run offline fixture tests
        run: python -B scripts/run_offline_tests.py
      - name: Install offline experiment test dependencies
        run: |
          python -m pip install "httpx==0.28.1" "beautifulsoup4==4.15.0" "duckdb==1.5.5" "playwright==1.42.0" "psutil==7.2.2"
      - name: Run Foody, Google resolution, and browser fixture tests
        run: python -B -m pytest experiments/foody experiments/google_resolution experiments/browser_framework/test_benchmark.py -q -p no:cacheprovider --basetemp "${{ runner.temp }}/fnb-experiment-pytest"
