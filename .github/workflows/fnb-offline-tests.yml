name: F&B offline tests

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-tests:
    name: ${{ matrix.profile }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: offline
            extras: test
          - profile: dbt-integration
            extras: test,dbt
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install ".[${{ matrix.extras }}]"
      - name: Run explicit fixture profile
        run: python -B scripts/run_offline_tests.py --profile ${{ matrix.profile }} --results-dir "${{ runner.temp }}/fnb-test-results"
      - name: Preserve test logs and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnb-${{ matrix.profile }}-results
          path: ${{ runner.temp }}/fnb-test-results/
          if-no-files-found: warn
