# Standalone analytics stack; also compatible with the existing platform overlay.
name: fnb-platform
services:
  postgres:
    image: postgres:15@sha256:3b0d656f5fff31c7d8a64f500a703dcf3f35e98ce78f602831a73059a5e6a012
    restart: unless-stopped
    environment:
      POSTGRES_USER: fnb_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${FNB_POSTGRES_PORT:-15432}:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fnb_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [platform]
  analytics-init:
    image: fnb/analytics:1.0.0
    build: &warehouse-build {context: ., dockerfile: docker/analytics/Dockerfile, target: warehouse}
    user: "50000:0"
    entrypoint: [/usr/local/bin/python, -B, /app/scripts/bootstrap_analytics.py]
    volumes: ["./scripts:/app/scripts:ro"]
    secrets: [admin_password, analytics_writer_password, analytics_readonly_password, superset_metadata_password]
    networks: [platform]
  analytics-build:
    image: fnb/analytics:1.0.0
    build: *warehouse-build
    user: "50000:0"
    entrypoint: [/usr/local/bin/python, -B, -m, fnb_platform.analytics.warehouse]
    environment: {PYTHONPATH: "/app/src:/app", PYTHONDONTWRITEBYTECODE: "1", DBT_SEND_ANONYMOUS_USAGE_STATS: "false"}
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./pipelines:/app/pipelines:ro
      - ./config:/app/config:ro
      - ./docker/analytics:/app/docker/analytics:ro
      - demo_outputs:/demo:ro
      - ./.local/m3/dashboard:/business-input:ro
      - ./output/area-demographics-silver-v1:/area-input:ro
      - ./.local/analytics:/analytics-out
    networks: [platform]
  analytics-load:
    image: fnb/analytics:1.0.0
    build: *warehouse-build
    user: "50000:0"
    entrypoint: [/usr/local/bin/python, -B, /app/scripts/load_analytics.py]
    environment: {PYTHONPATH: "/app/src:/app", PYTHONDONTWRITEBYTECODE: "1"}
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./docker/analytics:/app/docker/analytics:ro
      - ./.local/analytics:/analytics-out
    secrets: [analytics_writer_password, analytics_readonly_password]
    networks: [platform]
  superset-init: &superset
    image: fnb/superset:6.0.0
    build: {context: ./docker/analytics, target: superset}
    user: "superset"
    entrypoint: [/bin/sh, -c]
    command: ["superset db upgrade && superset init && python /workspace/docker/analytics/configure_superset.py"]
    environment:
      SUPERSET_CONFIG_PATH: /workspace/docker/analytics/superset_config.py
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./docker/analytics:/workspace/docker/analytics:ro
      - superset_home:/app/superset_home
      - ./.local/analytics:/analytics-out
    secrets: [superset_metadata_password, superset_secret_key, superset_admin_password, analytics_readonly_password]
    networks: [platform]
  superset:
    <<: *superset
    secrets: [superset_metadata_password, superset_secret_key]
    entrypoint: [gunicorn]
    command: [--bind, "0.0.0.0:8088", --workers, "1", --threads, "4", --worker-class, gthread, --timeout, "120", "superset.app:create_app()"]
    ports: ["127.0.0.1:${FNB_SUPERSET_PORT:-18088}:8088"]
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health',timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 18
volumes:
  postgres_data:
  demo_outputs:
  superset_home:
networks:
  platform:
secrets:
  admin_password: {file: ./.auth/fnb/admin_password}
  analytics_writer_password: {file: ./.auth/fnb/analytics_writer_password}
  analytics_readonly_password: {file: ./.auth/fnb/analytics_readonly_password}
  superset_metadata_password: {file: ./.auth/fnb/superset_metadata_password}
  superset_secret_key: {file: ./.auth/fnb/superset_secret_key}
  superset_admin_password: {file: ./.auth/fnb/superset_admin_password}
